name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend_ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend_ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet_ci:
    name: Restore, Build, Test & Publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore NutriExercise.sln

      - name: Build
        run: dotnet build NutriExercise.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test NutriExercise.sln --configuration Release --no-build

      - name: Publish binaries
        run: dotnet publish NutriExercise.Api --configuration Release --no-build --output ../publish/backend

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: nutrieexercise-backend
          path: publish/backend
          if-no-files-found: error