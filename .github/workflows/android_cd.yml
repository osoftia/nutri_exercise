name: Flutter Android CD

on:
  push:
    branches: [ "main" ]

jobs:
  # AI-in-the-loop gate: extracts Gherkin requirements and validates test
  # coverage. Exits 1 to block the release APK build below.
  ai-qa-gate:
    name: AI QA Gate - Gherkin Coverage
    uses: ./.github/workflows/ai_qa_gate.yml
    with:
      project: mobile_app
      threshold: 80
    secrets: inherit

  build-apk:
    name: Build Android APK
    needs: ai-qa-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile_app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nutri-exercise-apk
          path: mobile_app/build/app/outputs/flutter-apk/*-release.apk
