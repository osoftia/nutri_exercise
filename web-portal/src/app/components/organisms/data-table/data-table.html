<div class="data-table__wrap">
  <table class="data-table">
    <thead>
      <tr>
        @for (col of columns(); track col.key) {
          <th class="data-table__th">{{ col.label | translate }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track $index) {
        <tr class="data-table__row">
          @for (col of columns(); track col.key) {
            <td class="data-table__td">{{ row[col.key] | translate }}</td>
          }
        </tr>
      } @empty {
        <tr>
          <td class="data-table__empty" [attr.colspan]="columns().length">
            {{ 'history.noData' | translate }}
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
