<figure class="metric-chart">
  <div class="metric-chart__head">
    <div class="metric-chart__heading">
      <h3 class="metric-chart__title">{{ 'metrics.bloodPressure.title' | translate }}</h3>
      <span class="metric-chart__meta">{{ 'metrics.bloodPressure.meta' | translate }}</span>
    </div>
    <chart-legend [items]="legend" />
  </div>

  <div class="metric-chart__canvas">
    @if (layout(); as chart) {
      <svg
        class="metric-chart__svg"
        [attr.viewBox]="'0 0 ' + chart.frame.width + ' ' + chart.frame.height"
        role="img"
        [attr.aria-label]="'metrics.bloodPressure.aria' | translate"
      >
        <g chartGrid [plot]="chart.frame.plot" [yTicks]="chart.yTicks"></g>
        <g chartReferenceBands [plot]="chart.frame.plot" [bands]="chart.bands"></g>

        @for (point of chart.points; track point.date + point.kind) {
          <circle
            class="metric-chart__dot"
            [attr.data-tone]="point.tone"
            [attr.cx]="point.x"
            [attr.cy]="point.y"
            [attr.r]="point.kind === 'primary' ? 4 : 3"
          ></circle>
        }

        <g chartAxisY [plot]="chart.frame.plot" [ticks]="chart.yTicks"></g>
        <g chartAxisX [plot]="chart.frame.plot" [ticks]="chart.xTicks"></g>

        <rect
          class="metric-chart__hit"
          [attr.x]="chart.frame.plot.x"
          [attr.y]="chart.frame.plot.y"
          [attr.width]="chart.frame.plot.width"
          [attr.height]="chart.frame.plot.height"
          tabindex="0"
          (mousemove)="hover.onMove($event)"
          (mouseleave)="hover.clear()"
          (blur)="hover.clear()"
        ></rect>

        @if (hover.tooltip(); as tip) {
          <g
            chartTooltip
            [x]="tip.x"
            [y]="tip.y"
            [width]="tip.width"
            [height]="tip.height"
            [rows]="tip.rows"
          ></g>
        }
      </svg>
    } @else {
      <p class="metric-chart__empty">{{ 'metrics.empty' | translate }}</p>
    }
  </div>
</figure>
