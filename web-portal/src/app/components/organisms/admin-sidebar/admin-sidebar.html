<aside class="admin-sidebar" [class.admin-sidebar--collapsed]="isCollapsed()">
  <button
    class="admin-sidebar__toggle"
    type="button"
    [attr.aria-expanded]="!isCollapsed()"
    [attr.aria-label]="(isCollapsed() ? 'nav.expandSidebar' : 'nav.collapseSidebar') | translate"
    (click)="toggleCollapsed()"
  >
    <span aria-hidden="true">{{ isCollapsed() ? '›' : '‹' }}</span>
  </button>

  <a class="admin-sidebar__brand" routerLink="/history">
    <span class="admin-sidebar__logo">N</span>
    <span class="admin-sidebar__title">NutriExercise</span>
  </a>

  <nav class="admin-sidebar__nav" [attr.aria-label]="'nav.mainNavigation' | translate">
    @for (item of navItems; track item.label) {
      <a
        class="admin-sidebar__link"
        [routerLink]="item.link"
        routerLinkActive="admin-sidebar__link--active"
        ariaCurrentWhenActive="page"
      >
        <app-icon [name]="item.icon" />
        <span>{{ item.label | translate }}</span>
      </a>
    }
  </nav>

  <div class="admin-sidebar__footer">
    <app-icon name="logout" />
    <span>{{ 'nav.signOut' | translate }}</span>
  </div>
</aside>
