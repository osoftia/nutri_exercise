<section class="board-column" [attr.aria-label]="column().title">
  <header class="board-column__header" cdkDragHandle>
    <h3 class="board-column__title">{{ column().title }}</h3>
    <span class="board-column__count">{{ exercises().length }}</span>
  </header>
  <div class="board-column__schedule">
    <span class="board-column__day">{{ column().dayOfWeek }}</span>
    <select
      class="board-column__day-select"
      [value]="column().dayOfWeek"
      (change)="onDayChange($any($event.target).value)"
      [attr.aria-label]="'Assign ' + column().title + ' to a day'"
    >
      @for (day of days; track day) {
        <option [value]="day">{{ day }}</option>
      }
    </select>
  </div>
  <div class="board-column__zones">
    @for (zone of column().bodyZones; track zone) {
      <span class="board-column__zone">{{ zone }}</span>
    } @empty {
      <span class="board-column__zone board-column__zone--empty">No body zones</span>
    }
  </div>
  <div class="board-column__zone-add">
    <app-form-input label="Body zone" placeholder="Legs" [(value)]="zoneDraft" />
    <app-custom-button variant="ghost" (click)="addZone()" [disabled]="!zoneDraft().trim()">
      Add
    </app-custom-button>
  </div>
  <div
    class="board-column__cards"
    cdkDropList
    [id]="column().id"
    [cdkDropListData]="column().exerciseIds"
    [cdkDropListConnectedTo]="connectedIds()"
    (cdkDropListDropped)="drop.emit($event)"
  >
    @for (exercise of exercises(); track exercise.id) {
      <app-exercise-card
        cdkDrag
        [cdkDragData]="exercise.id"
        [exercise]="exercise"
        [selected]="selectedIds().has(exercise.id)"
        (toggleSelect)="toggleSelect.emit($event)"
        (rename)="rename.emit($event)"
      />
    } @empty {
      <p class="board-column__empty">Drop exercises here</p>
    }
  </div>
  <footer class="board-column__footer">
    <app-custom-button variant="text" (click)="duplicate.emit(column().id)">
      Duplicate to days…
    </app-custom-button>
  </footer>
</section>
