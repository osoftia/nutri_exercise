<button
  class="theme-switcher"
  type="button"
  role="switch"
  [attr.aria-checked]="store.isApple()"
  [attr.aria-label]="(store.isApple() ? 'settings.switchEditorial' : 'settings.switchApple') | translate"
  (click)="store.toggleTheme()"
>
  <span class="theme-switcher__copy">
    <span class="theme-switcher__eyebrow">{{ 'settings.visualMode' | translate }}</span>
    <span class="theme-switcher__name">{{ store.isApple() ? 'Apple' : 'Editorial' }}</span>
  </span>
  <span class="theme-switcher__track" aria-hidden="true">
    <span class="theme-switcher__thumb"></span>
  </span>
</button>
