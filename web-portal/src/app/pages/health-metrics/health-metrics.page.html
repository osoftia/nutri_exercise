<section class="health-metrics">
  <header class="health-metrics__header">
    <span class="health-metrics__overline">{{ 'metrics.overline' | translate }}</span>
    <h1 class="health-metrics__title">{{ 'metrics.title' | translate }}</h1>
    <p class="health-metrics__subtitle">{{ 'metrics.subtitle' | translate }}</p>
  </header>

  @if (store.isLoading()) {
    <div class="health-metrics__state" role="status" aria-live="polite">
      <span class="health-metrics__overline">{{ 'metrics.loading' | translate }}</span>
      <span class="health-metrics__pulse"></span>
    </div>
  } @else if (store.error(); as message) {
    <div class="health-metrics__state health-metrics__state--error" role="alert">
      <span class="health-metrics__overline">{{ 'metrics.error' | translate }}</span>
      <p class="health-metrics__state-text">{{ message }}</p>
      <button type="button" class="health-metrics__retry" (click)="store.load()">
        {{ 'metrics.retry' | translate }}
      </button>
    </div>
  } @else {
    <div class="health-metrics__grid">
      <app-blood-pressure-scatter class="health-metrics__span-12" [data]="store.bloodPressure()" />
      <app-glucose-line class="health-metrics__span-6" [data]="store.glucose()" />
      <app-bmi-area class="health-metrics__span-6" [data]="store.bmi()" />
      <app-sleep-quality-heatmap class="health-metrics__span-12" [data]="store.sleep()" />
      <app-active-calories-bar class="health-metrics__span-12" [data]="store.activeCalories()" />
    </div>
  }
</section>
